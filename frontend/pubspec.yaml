name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  device_info_plus: ^12.3.0
  get_it: ^9.2.0
  http_interceptor: ^2.0.0
  logger: ^2.6.2
  formz: ^0.8.0
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^2.4.4
  rust_lib_frontend:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  freezed: ^2.5.3
  build_runner: ^2.4.11

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf

        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic

        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 600

        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 700

        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 900