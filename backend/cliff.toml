# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]

# 日志头部
header = """
# Changelog

All notable changes to this project will be documented in this file.
See [conventional commits](https://www.conventionalcommits.org/) for commit guidelines.
"""

# 日志主体模板
# 优化点:
# 1. 统一了有 scope 和无 scope 提交的输出格式，避免了重复的 for 循环
# 2. 使用了更简洁的语法和条件判断
body = """
---
{% if version %}
    {% if previous.version %}
        ## [{{ version | trim_start_matches(pat="v") }}]({{ repository_url }}/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}
{% else %}
    ## [unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits | sort(attribute="scope") %}
        - **({{ commit.scope | default(value="general") }})**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message | trim }} - ([{{ commit.id | truncate(length=7, end="") }}]({{ repository_url }}/commit/{{ commit.id }})) - {{ commit.author.name }}
    {% endfor %}
{% endfor %}
"""

# 日志尾部
footer = """
<!-- generated by git-cliff -->
"""

# 移除模板首尾的空白字符
trim = true

[git]
# 基于 Conventional Commits 规范解析提交
conventional_commits = true

# 过滤掉不符合 Conventional Commits 规范的提交
filter_unconventional = false

# 将提交消息的每一行作为独立的提交处理
split_commits = false

# 提交消息预处理规则
commit_preprocessors = [
    # 示例：将提交信息中的 #123 转换为 GitHub Issue 链接
    # { pattern = '\((\w+\s)?\#([0-9]+)\)', replace = "([#${2}](${repository_url}/issues/${2}))" },
]

# 提交解析与分组规则
# 优化点:
# 1. 对规则进行了分组和排序，逻辑更清晰
# 2. 将安全相关的提交解析移至前面，确保其优先级
commit_parsers = [
    # 跳过规则
    { message = "\\[skip", skip = true },
    { message = "\\p{Han}", skip = true },
    { message = "^chore\\(version\\):", skip = true },

    # 功能与修复分组
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },

    # 文档与性能分组
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },

    # 代码质量分组
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Style" },
    { message = "^revert", group = "Revert" },

    # 测试与杂项分组
    { message = "^test", group = "Tests" },
    { message = "^chore", group = "Miscellaneous Chores" },

    # 安全相关分组（从 commit body 中提取）
    { body = ".*security", group = "Security" },

    # 其他未匹配的提交
    { message = ".*", group = "Other" },
]

# 保护破坏性变更不被跳过规则忽略
protect_breaking_commits = false

# 过滤掉未被 commit_parsers 匹配的提交
filter_commits = false

# 用于匹配 Git 标签的正则表达式
tag_pattern = "v[0-9]+.[0-9]+.[0-9]+"